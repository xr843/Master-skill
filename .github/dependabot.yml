version: 2

# Dependabot keeps our supply chain fresh:
#   - github-actions: bumps the SHA-pinned actions in .github/workflows/.
#     Dependabot writes the new SHA + a comment with the new version.
#   - npm:            bumps the (currently empty) package.json deps + the
#     globally-pinned promptfoo@<ver> in persona-fidelity.yml.
#   - pip:            bumps requirements.txt (Python validators).
#   - cargo:          bumps desktop/Cargo.toml + Cargo.lock (408 crates behind
#     eframe/egui). This was the ecosystem NOT covered until 2026-09-06 — and
#     the only one whose output is an executable users download and run
#     directly from Releases. npm and pip ship source you can read; the
#     desktop binary is opaque, so an unwatched dependency tree there is the
#     worst place to have one.
#
# All updates open weekly Monday PRs with the `dependencies` label plus an
# ecosystem-specific label so the maintainer can filter quickly. Major-
# version bumps are NOT auto-merged — they require explicit review.
#
# Two groups exist because ungrouped PRs for them can never go green alone:
#   - codeql-action: init and analyze are separate "dependencies" to
#     dependabot, so it opened one PR per step (#262, #263). CodeQL refuses a
#     config written by one version and analysed by another ("Loaded a
#     configuration file for version '4.38.0', but running version
#     '4.38.1'"), so each PR failed Security Scanning and neither could merge.
#   - eval-sdks: requirements-eval.txt pins must carry a comment saying why
#     that version (tests/test_requirements.py), so every bump needs a human
#     edit anyway — one PR means one review and one run of the verification
#     in CONTRIBUTING § 7, not two.

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "pip"
    groups:
      eval-sdks:
        patterns:
          - "anthropic"
          - "openai"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  - package-ecosystem: "cargo"
    directory: "/desktop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
