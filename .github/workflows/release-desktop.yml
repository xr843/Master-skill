name: Release Desktop Binaries

# Builds the pure-Rust egui/eframe desktop app (desktop/) for Linux,
# Windows, and macOS, then assembles the three raw binaries, executable-bit-
# preserving Linux/macOS tarballs, and a SHA256SUMS manifest:
#   - on `release: published`   → attaches the complete verified asset set
#     to that GitHub release via one `gh release upload` invocation.
#   - on `workflow_dispatch`    → uploads the same complete set as one workflow
#     artifact. It never touches a release — use this to dry-run build,
#     packaging, and checksum generation before cutting a real release.
#
# `$GITHUB_REF_NAME` is used (not `github.event.release.tag_name`) because
# for the `release` event GitHub sets `GITHUB_REF` to `refs/tags/<tag>`,
# so `GITHUB_REF_NAME` already equals the release tag name. This also
# keeps the upload step identical in spirit to a tag-push release flow.
#
# Supply-chain hardening (matches npm-publish.yml / validate-and-test.yml):
#   - All `uses:` are pinned to a full commit SHA + version comment.
#     Bumps are PR'd by Dependabot (see .github/dependabot.yml).
#   - No third-party Rust-toolchain action is introduced: the GitHub-hosted
#     runners already ship a recent stable rustc/cargo, which is enough for
#     this workflow (no cross-compilation, no MSRV pin needed).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  # Matrix builders only read source and upload workflow artifacts. Release
  # write access is elevated on the assembly job alone, where `gh release
  # upload` is guarded by the release-event condition.
  contents: read

jobs:
  build:
    name: Build (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: master-skill-desktop-linux-x86_64
            binary_path: desktop/target/release/master-skill-desktop
          - os: windows-latest
            artifact_name: master-skill-desktop-windows-x86_64.exe
            binary_path: desktop/target/release/master-skill-desktop.exe
          - os: macos-latest
            # macos-latest runners are Apple Silicon (arm64) hosts, so a
            # native `cargo build --release` here already produces an
            # aarch64-apple-darwin binary — no cross-compile flags needed.
            artifact_name: master-skill-desktop-macos-aarch64
            binary_path: desktop/target/release/master-skill-desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install native GUI build dependencies (Linux only)
        if: runner.os == 'Linux'
        # eframe/winit link against these X11/Wayland/xkb dev libraries at
        # build time on Linux; other platforms use their native toolkits.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libwayland-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Show Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Build desktop app
        # --locked: desktop/Cargo.lock is committed, so release builds must
        # use exactly those dependency versions instead of silently
        # re-resolving (and potentially drifting from what CI/tests used).
        run: cargo build --release --locked --manifest-path desktop/Cargo.toml

      - name: Stage renamed binary
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary_path }}" "dist/${{ matrix.artifact_name }}"

      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x "dist/${{ matrix.artifact_name }}"
          tar -czf "dist/${{ matrix.artifact_name }}.tar.gz" \
            -C dist "${{ matrix.artifact_name }}"

      - name: Smoke-test staged binary (Linux only)
        if: runner.os == 'Linux'
        # Guards against non-portable binaries (e.g. one that bakes in a
        # compile-time repo path that only exists on this runner) reaching
        # a release: run the staged artifact's headless `--baseline` from
        # the checkout root, the same way a downloaded release binary is
        # documented to be run, with an isolated store so it can't read or
        # write a real user's trace history. `python3` is preinstalled on
        # GitHub-hosted Linux runners, which `--baseline` shells out to.
        shell: bash
        run: |
          chmod +x "dist/${{ matrix.artifact_name }}"
          XDG_DATA_HOME="$(mktemp -d)" "./dist/${{ matrix.artifact_name }}" --baseline

      - name: Upload staged assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: desktop-assets-${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: error

  assemble:
    name: Assemble verified release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download staged assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: desktop-assets-*
          path: dist
          merge-multiple: true

      - name: Generate and verify SHA256SUMS
        shell: bash
        run: |
          cd dist
          EXPECTED_ASSETS=(
            master-skill-desktop-linux-x86_64
            master-skill-desktop-linux-x86_64.tar.gz
            master-skill-desktop-macos-aarch64
            master-skill-desktop-macos-aarch64.tar.gz
            master-skill-desktop-windows-x86_64.exe
          )
          for asset in "${EXPECTED_ASSETS[@]}"; do
            if [ ! -f "$asset" ]; then
              echo "::error::missing assembled desktop asset: $asset"
              exit 1
            fi
          done
          mapfile -t ACTUAL_ASSETS < <(
            find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort
          )
          if [ "${#ACTUAL_ASSETS[@]}" -ne "${#EXPECTED_ASSETS[@]}" ]; then
            echo "::error::assembled asset count does not match the release contract"
            printf 'actual: %s\n' "${ACTUAL_ASSETS[@]}"
            exit 1
          fi
          printf '%s\n' "${EXPECTED_ASSETS[@]}" | LC_ALL=C sort |
            while IFS= read -r asset; do sha256sum "$asset"; done > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload complete release asset set
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber

      - name: Upload combined workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: master-skill-desktop-release-assets
          path: dist/*
          if-no-files-found: error
