name: Verify FoJin Links

on:
  schedule:
    # Run every Monday at 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-eval.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run verify_sources.py (dry run)
        id: verify
        # `shell: bash` is what buys `-o pipefail`. The implicit default is
        # `bash -e {0}` with no pipefail, so `python3 … | tee` returned tee's 0 and a
        # crashed run passed the step. Every counter below then fell back to "0"
        # through `|| echo "0"`, the issue condition read all-clear, and the week
        # looked clean. A crash must not be indistinguishable from nothing to report.
        shell: bash
        run: |
          cd "${{ github.workspace }}"
          python3 tools/verify_sources.py 2>&1 | tee verify_output.txt
          # pipefail catches a non-zero exit; this catches the other half — a run that
          # returns 0 but stopped before printing what the greps below read.
          if ! grep -q '^Summary$' verify_output.txt; then
            echo "::error::verify_sources.py printed no Summary block — it did not finish, so the counts below would all read 0."
            exit 1
          fi
          # Extract key stats for the issue body
          FAILED=$(grep -oP "Not found in FoJin:\s*\K\d+" verify_output.txt || echo "0")
          UPDATES=$(grep -oP "URL replacements:\s*\K\d+" verify_output.txt || echo "0")
          # 卷号写错的声明。FoJin 的查询不含卷号，所以 FAILED 那一行结构上
          # 看不见这一类 —— master-zhiyi 的 `T33n1718` 就是这样连续多周绿灯
          # 走过去的，直到一次评测跑分把模型写对的 `T33n1716` 判成伪造才翻出来。
          MISMATCHED=$(grep -oP "CBETA id mismatches:\s*\K\d+" verify_output.txt || echo "0")
          # 题名对不上的声明：经号查得到、卷号也对，却是另一部书。master-yinguang
          # 把《印光法师文钞》声明成 X62n1182–1184（实为《徹悟禪師語錄》等），
          # 上面三项都看不见。
          TITLE_MISMATCHED=$(grep -oP "CBETA title mismatches:\s*\K\d+" verify_output.txt || echo "0")
          # SKILL.md frontmatter 里指向别的书的 fojin_text_id（人设给读者拼链接用）。
          FRONTMATTER_MISMATCHED=$(grep -oP "Frontmatter FoJin id mismatches:\s*\K\d+" verify_output.txt || echo "0")
          # 人设文档里引文后的 FoJin 链接打开了别的书（2026-09-15 首次核查发现 16 处）。
          DOC_LINK_MISMATCHED=$(grep -oP "Doc citation links to another work:\s*\K\d+" verify_output.txt || echo "0")
          # 摘录里的「原典」引文有分句不在所引那一卷（2026-09-15 首次核查发现 19 段）。
          EXCERPT_QUOTE_MISMATCHED=$(grep -oP "Excerpt quotes not in the cited text:\s*\K\d+" verify_output.txt || echo "0")
          # 声明的 BDRC 作品号不存在，或是另一部书（2026-09-15 首次核查：master-milarepa
          # 的 W22272 是宗喀巴全集，W1KG14334 查无此号；library.bdrc.io 对任何号都回 200）。
          BDRC_MISMATCHED=$(grep -oP "BDRC records that do not match:\s*\K\d+" verify_output.txt || echo "0")
          # 人设里当原话引的句子，CBETA 全文里查不到（2026-09-15 首次手工核查：玄奘、
          # 智顗、法藏、蕅益的示例句里 5 条查无出处，3 条是灌顶/澄观/彭际清的话）。
          QUOTED_LINES=$(grep -oP "Quoted lines CBETA does not have:\s*\K\d+" verify_output.txt || echo "0")
          # 祖师自己的语录本就在 CBETA 之外时，上一项只能记「未判定」。这一项进原书
          # （印光《文钞》、虚云《法汇》）逐字找，把那个盲区里的引文真正核一遍。
          # 只有声明的编集语录全都取得到的祖师才会计入，取不到的一律记未判定。
          COMPILED_QUOTED_LINES=$(grep -oP "Quoted lines the compiled teachings do not have:\s*\K\d+" verify_output.txt || echo "0")
          # 某位祖师的语料一篇都没取到 —— 那上面那一项对他恒为 0，不是因为引文都对，
          # 而是因为什么都没查。不单独报出来，取数坏掉的 3i 会一直绿着。
          COMPILED_UNREADABLE=$(grep -oP "Compiled teaching corpora that could not be read:\s*\K\d+" verify_output.txt || echo "0")
          # 「原典」块本身。3f 只认引用格式带 CBETA 经号的块，《文钞》没有经号，
          # 于是 master-yinguang 的五个块对每一步检查都不可见 —— 2026-09-16 核出
          # 其中两块是真语拼接的改写，却一直以「原典」示人。
          EXCERPT_BLOCKS=$(grep -oP "Excerpt blocks the compiled teachings do not have:\s*\K\d+" verify_output.txt || echo "0")
          # 一组重定向而不是多条 —— shellcheck SC2129。
          {
            echo "failed=$FAILED"
            echo "updates=$UPDATES"
            echo "mismatched=$MISMATCHED"
            echo "title_mismatched=$TITLE_MISMATCHED"
            echo "frontmatter_mismatched=$FRONTMATTER_MISMATCHED"
            echo "doc_link_mismatched=$DOC_LINK_MISMATCHED"
            echo "excerpt_quote_mismatched=$EXCERPT_QUOTE_MISMATCHED"
            echo "bdrc_mismatched=$BDRC_MISMATCHED"
            echo "quoted_lines=$QUOTED_LINES"
            echo "compiled_quoted_lines=$COMPILED_QUOTED_LINES"
            echo "compiled_unreadable=$COMPILED_UNREADABLE"
            echo "excerpt_blocks=$EXCERPT_BLOCKS"
          } >> "$GITHUB_OUTPUT"

      - name: Create issue if links need updating
        if: steps.verify.outputs.updates != '0' || steps.verify.outputs.failed != '0' || steps.verify.outputs.mismatched != '0' || steps.verify.outputs.title_mismatched != '0' || steps.verify.outputs.frontmatter_mismatched != '0' || steps.verify.outputs.doc_link_mismatched != '0' || steps.verify.outputs.excerpt_quote_mismatched != '0' || steps.verify.outputs.bdrc_mismatched != '0' || steps.verify.outputs.quoted_lines != '0' || steps.verify.outputs.compiled_quoted_lines != '0' || steps.verify.outputs.compiled_unreadable != '0' || steps.verify.outputs.excerpt_blocks != '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('verify_output.txt', 'utf8');
            const failed = '${{ steps.verify.outputs.failed }}';
            const updates = '${{ steps.verify.outputs.updates }}';
            const { owner, repo } = context.repo;
            const marker = '<!-- verify-fojin-links -->';

            const title = `[Weekly] FoJin links need update — ${updates} URLs, ${failed} missing`;
            const body = `${marker}\n` +
                  `Automated weekly link verification found changes.\n\n` +
                  `- **URL replacements needed:** ${updates}\n` +
                  `- **CBETA IDs not found in FoJin:** ${failed}\n` +
                  `- **Declared IDs CBETA disagrees with:** ${{ steps.verify.outputs.mismatched }}\n` +
                  `- **Declared titles CBETA disagrees with:** ${{ steps.verify.outputs.title_mismatched }}\n` +
                  `- **Frontmatter FoJin ids that point elsewhere:** ${{ steps.verify.outputs.frontmatter_mismatched }}\n` +
                  `- **Doc citation links that open another work:** ${{ steps.verify.outputs.doc_link_mismatched }}\n` +
                  `- **Excerpt quotations not in the cited fascicle:** ${{ steps.verify.outputs.excerpt_quote_mismatched }}\n` +
                  `- **Declared BDRC ids that are missing or another work:** ${{ steps.verify.outputs.bdrc_mismatched }}\n` +
                  `- **Quoted lines CBETA does not have:** ${{ steps.verify.outputs.quoted_lines }}\n` +
                  `- **Quoted lines the compiled teachings do not have:** ${{ steps.verify.outputs.compiled_quoted_lines }}\n` +
                  `- **Compiled teaching corpora that could not be read at all:** ${{ steps.verify.outputs.compiled_unreadable }}\n` +
                  `- **「原典」 blocks the compiled teachings do not have:** ${{ steps.verify.outputs.excerpt_blocks }}\n` +
                  `- **Last run:** ${new Date().toISOString()}\n\n` +
                  `## Full output\n\n\`\`\`\n${output}\n\`\`\`\n\n` +
                  `Run \`python3 tools/verify_sources.py --fix\` locally and commit the changes.`;

            // Reuse a single tracking issue: update the most recent open one and
            // close any older duplicates so the tracker doesn't accumulate.
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'automated',
              sort: 'created', direction: 'desc', per_page: 100,
            });
            // Match the marker, or (for pre-marker issues) the legacy title prefix.
            const tracked = existing.filter(i => !i.pull_request && (
              (i.body || '').includes(marker) ||
              i.title.startsWith('[Weekly] FoJin links need update')
            ));

            if (tracked.length === 0) {
              await github.rest.issues.create({
                owner, repo, title, body, labels: ['maintenance', 'automated'],
              });
            } else {
              const [keep, ...stale] = tracked;
              await github.rest.issues.update({
                owner, repo, issue_number: keep.number, title, body,
              });
              for (const dup of stale) {
                await github.rest.issues.update({
                  owner, repo, issue_number: dup.number, state: 'closed',
                  state_reason: 'not_planned',
                });
                await github.rest.issues.createComment({
                  owner, repo, issue_number: dup.number,
                  body: `Superseded by #${keep.number} — consolidating into a single link-verification tracker.`,
                });
              }
            }
