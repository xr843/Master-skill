name: Persona Fidelity

# v0.8 persona-fidelity eval pipeline.
#
# Two stages:
#
#   1. promptfooconfig schema + repo-convention validation — ALWAYS runs.
#      No API key needed. Catches structural drift on every matching PR.
#
#   2. llm-rubric eval against the persona prompts — runs only with an
#      ANTHROPIC_API_KEY. Fork PRs have no secret access, and the project's
#      stated policy is "do not pay for LLM-as-judge in CI", so on a pull
#      request a missing key skips this stage (declared in ADVISORY_GATES in
#      scripts/check-gate-liveness.py). A manual dispatch is someone asking
#      for a paid run: there a missing key FAILS the job, and so does any
#      rubric failure — the eval is no longer `|| true`.
#
# There is no cron. A weekly schedule used to run this with no key configured,
# skip stage 2 and conclude success — a green Monday tick that evaluated
# nothing. Stage 1 still runs on every PR that touches personas or scripts, and
# the repo-convention validator also runs in validate-and-test.yml's validate
# job, as part of the gate registry's `content` group.
#
# Automatic paid evaluation retains the original three representative personas.
# All 15 configs are validated for free. The expanded paid sweep requires manual
# dispatch with full_suite=true; never silently multiply paid CI scope by adding
# configs. Runtime prompts now include real sources, so old miniature-prompt cost
# estimates no longer describe these calls. Budget before requesting a full sweep.

on:
  pull_request:
    paths:
      - 'prebuilt/master-*/**'
      - 'tests/persona/**'
      - 'scripts/validate-promptfoo-configs.py'
      - 'scripts/**'
      - '.github/workflows/persona-fidelity.yml'
      - '.github/promptfoo/package.json'
      - 'requirements-dev.txt'
  workflow_dispatch:
    inputs:
      full_suite:
        description: 'Run paid evaluation for all 15 personas (budget first)'
        type: boolean
        default: false

# Least privilege: schema validation + rubric eval only read the repo and
# upload artifacts. No contents/issues/PR writes needed. Pinned here so the
# token stays read-only regardless of the repo default.
permissions:
  contents: read

# Superseded runs are cancelled: pushing three commits to a PR used to start
# three full matrices and let all three finish.
#
# Keyed on `github.head_ref || github.ref`, not `github.ref` alone. For a PR,
# the `push` and `pull_request` events carry different refs
# (`refs/heads/<branch>` vs `refs/pull/N/merge`) and so landed in different
# groups — two concurrent runs of the same workflow on the same commit, which
# is half of what this was meant to stop. `head_ref` is set only on
# pull_request events and names the source branch, so both now share a group.
#
# `cancel-in-progress: false` on main does NOT mean main runs independently —
# it means they QUEUE, and GitHub cancels a *pending* run when a newer one
# queues behind it. A merge landing while a long manual eval holds the group
# could therefore still be dropped. main is given its own per-run group instead, so
# merges never contend at all.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.ref == 'refs/heads/main' && github.run_id
      || github.head_ref || github.ref
    }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  fidelity:
    name: Persona-fidelity schema + rubric eval
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python deps (validator + runtime-prompt test)
        # requirements-dev.txt (pytest), not requirements-eval.txt: nothing here
        # imports the anthropic / openai SDKs — promptfoo calls the provider
        # itself — so this job no longer installs them.
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run repo-convention validator (always)
        # This is the gate: filename convention, RAW/SPE/CUS coverage,
        # llm-rubric presence, contains-any whitelist, shared.yaml sync.
        run: python scripts/validate-promptfoo-configs.py

      - name: Install promptfoo CLI (pinned)
        # The version lives in .github/promptfoo/package.json, which the
        # Dependabot npm ecosystem watches (.github/dependabot.yml). A version
        # written here instead would be invisible to Dependabot — the root
        # package.json has no dependencies — which is what this comment used to
        # claim did not matter.
        shell: bash
        run: |
          PROMPTFOO_VERSION=$(node -p "require('./.github/promptfoo/package.json').devDependencies.promptfoo")
          npm install -g "promptfoo@${PROMPTFOO_VERSION}"

      - name: Validate promptfoo YAML schema (always)
        # Falls back gracefully if `promptfoo validate` is unavailable in this
        # CLI release — we still ran the repo-convention check above.
        run: |
          set -e
          for cfg in tests/persona/*.promptfooconfig.yaml; do
            echo "::group::promptfoo validate $cfg"
            if promptfoo validate -c "$cfg"; then
              echo "  OK"
            else
              echo "::warning file=$cfg::promptfoo validate exited non-zero — advisory"
            fi
            echo "::endgroup::"
          done

      - name: Verify real runtime prompts (local provider, no API calls)
        env:
          MASTER_SKILL_REQUIRE_PROMPTFOO: '1'
        run: python -m pytest scripts/tests/test_persona_runtime_prompt.py -q

      - name: Detect ANTHROPIC_API_KEY
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          FIDELITY_GRADING_REQUIRED: ${{ vars.FIDELITY_GRADING_REQUIRED }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "${FIDELITY_GRADING_REQUIRED:-}" = "true" ]; then
              echo "::error::ANTHROPIC_API_KEY is not configured — a manually dispatched (or FIDELITY_GRADING_REQUIRED) persona eval must grade, not skip."
              exit 1
            fi
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY not set — skipping llm-rubric eval on this pull request (schema validation passed)."
            {
              echo "### llm-rubric eval skipped — this green tick evaluated no model response"
              echo
              echo "ANTHROPIC_API_KEY is not configured; only the promptfoo schema and repo-convention validation ran."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run llm-rubric eval
        if: steps.key.outputs.run == 'true'
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MASTER_SKILL_FULL_PERSONA_EVAL: ${{ github.event_name == 'workflow_dispatch' && inputs.full_suite }}
        run: |
          mkdir -p .promptfoo-results
          configs=(tests/persona/{huineng,ajahn-chah,tsongkhapa}.promptfooconfig.yaml)
          if [ "$MASTER_SKILL_FULL_PERSONA_EVAL" = true ]; then
            configs=(tests/persona/*.promptfooconfig.yaml)
          fi
          # Every config runs even after one fails, so the artifact carries all
          # results; the step then fails if any did. Nothing masks the exit
          # code any more (each call used to end in an or-true): an eval that
          # cannot fail is not an eval.
          failed=()
          for cfg in "${configs[@]}"; do
            slug=$(basename "$cfg" .promptfooconfig.yaml)
            if ! promptfoo eval -c "$cfg" -o ".promptfoo-results/${slug}.json"; then
              failed+=("$slug")
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::llm-rubric eval failed for: ${failed[*]}"
            exit 1
          fi

      - name: Upload eval results
        if: always() && steps.key.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: persona-fidelity-results-${{ github.run_id }}
          path: .promptfoo-results/
          if-no-files-found: ignore
