[package]
name = "master-skill-desktop"
version = "0.1.0"
edition = "2021"
# eframe 0.36 起要求 rustc 1.95(0.31 时代没有下限声明,等于「碰巧能编」)。
# 写出来是为了让不够新的工具链得到一句准话,而不是一屏 egui 内部的语法错误。
# CI 的 GitHub 托管镜像 2026-09-13 为 1.98.1。
rust-version = "1.95"
publish = false

[lib]
name = "master_skill_desktop"
path = "src/lib.rs"

[[bin]]
name = "master-skill-desktop"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# `eframe` re-exports egui, and every use site in src/ is `use eframe::egui`
# — there is no `use egui::` anywhere. Declaring egui directly on top of that
# let Dependabot bump it alone (#165), which pulled egui 0.36's whole tree into
# the lockfile *beside* the egui 0.31 that eframe 0.31 depends on — two
# accesskit versions, two epaint versions, and a green CI because nothing in
# this crate actually imported the newer one. Removed: one version of egui,
# chosen by eframe.
# glow, explicitly, not eframe's defaults. eframe 0.31's default features
# enabled the glow (OpenGL) renderer; 0.36's enable wgpu instead, so taking the
# defaults in the 0.31 → 0.36 port silently switched this app to a GPU backend
# it had never used. On Windows, wgpu's DirectX 12 backend then failed to
# compile — `gpu-allocator` had locked `windows` 0.58 while `wgpu-hal` needed
# 0.62 — and v0.12.0's desktop release shipped no binaries at all. This is the
# default feature set minus `wgpu` plus `glow`: the renderer every earlier
# release used. The stripped Linux binary also drops by more than a quarter.
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "links", "wayland", "web_screen_reader", "x11"] }
fs4 = { version = "1.1", default-features = false, features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
wait-timeout = "0.2"

# `AttachConsole` for `--help` / `--baseline` in the GUI-subsystem Windows build
# (see src/main.rs). 0.61 is the version eframe, fs4 and tempfile already lock,
# so this adds no crate to the build.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

# Strip symbols from release binaries. Measured on the eframe 0.36 build:
# 26,903,544 → 21,277,616 bytes (−20%), and the stripped binary runs. The cost
# is a panic backtrace showing addresses instead of function names; this app
# has no crash reporting, and dev builds keep their symbols.
[profile.release]
strip = true
