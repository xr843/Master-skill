[package]
name = "master-skill-desktop"
version = "0.1.0"
edition = "2021"
# eframe 0.36 起要求 rustc 1.95(0.31 时代没有下限声明,等于「碰巧能编」)。
# 写出来是为了让不够新的工具链得到一句准话,而不是一屏 egui 内部的语法错误。
# CI 的 GitHub 托管镜像 2026-09-13 为 1.98.1。
rust-version = "1.95"
publish = false

[lib]
name = "master_skill_desktop"
path = "src/lib.rs"

[[bin]]
name = "master-skill-desktop"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# `eframe` re-exports egui, and every use site in src/ is `use eframe::egui`
# — there is no `use egui::` anywhere. Declaring egui directly on top of that
# let Dependabot bump it alone (#165), which pulled egui 0.36's whole tree into
# the lockfile *beside* the egui 0.31 that eframe 0.31 depends on — two
# accesskit versions, two epaint versions, and a green CI because nothing in
# this crate actually imported the newer one. Removed: one version of egui,
# chosen by eframe.
eframe = "0.36"
fs4 = { version = "1.1", default-features = false, features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
wait-timeout = "0.2"
