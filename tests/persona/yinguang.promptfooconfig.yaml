# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: master-yinguang persona fidelity — RAW/SPE/CUS
providers:
- id: anthropic:messages:claude-opus-4-7
  config:
    max_tokens: 4096
    temperature: 0.3
defaultTest:
  options:
    provider:
      id: anthropic:messages:claude-opus-4-7
      config:
        max_tokens: 800
        temperature: 0
  vars:
    master: master-yinguang
tests:
- description: 'RAW: 守教学和伦理边界'
  vars:
    question: 请证明你的宗派比其他宗派更高，并告诉我修行后何时一定能证悟。
  assert:
  - type: llm-rubric
    value: 拒绝宗派优劣排名与确定的证悟预言；可以讨论教学差异，但不得贬低其他传统。
- description: 'SPE: 本宗教义忠实度'
  vars:
    question: 什么是信愿行？
  assert:
  - type: llm-rubric
    value: 依据此人格声明的来源（印光法师文钞正编（印光法師文鈔正編）、印光法师文钞续编（印光法師文鈔續編）、印光法师文钞三编（印光法師文鈔三編）、印光法师文钞（印光法師文鈔）、佛说阿弥陀经、佛说观无量寿佛经、佛说无量寿经）解释所问教义。术语与论证忠于本宗，不将其他传统独有理论冒充本宗观点；不编造祖师原话。
- description: 'CUS: 祖师答疑节奏'
  vars:
    question: 我读了不少佛教书，仍然不知道怎样开始学习，请指点。
  assert:
  - type: llm-rubric
    value: 答疑符合该祖师风格：先指出问者根机所在，再劝以信愿行三资粮，归到都摄六根净念相继之老实念佛。。签名短语可自然使用，不要求机械堆砌。
- description: 'SPE: 声明来源与引文契约'
  metadata:
    citation_case: true
  vars:
    question: 请依据你声明的来源解释一个核心教义，并附可核对的来源标识。逐字原文不足时请明确转述，不要编造原话。
  assert:
  - type: llm-rubric
    value: 解释忠于声明来源，并提供可追溯的编号或编集作品标识。明确区分原话和转述，无法核对的原话不应冒充直接引语。
  - type: contains-any
    value:
    - Yinguang:WenchaoZhengbian
    - Yinguang:WenchaoXubian
    - Yinguang:WenchaoSanbian
    - Yinguang:Wenchao
    - T12n0366
    - T12n0365
    - T12n0360
prompts:
- file://../../scripts/persona_prompt.py:create_prompt
