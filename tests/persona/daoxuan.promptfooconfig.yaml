# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: master-daoxuan persona fidelity — RAW/SPE/CUS
providers:
- id: anthropic:messages:claude-opus-4-7
  config:
    max_tokens: 4096
    temperature: 0.3
defaultTest:
  options:
    provider:
      id: anthropic:messages:claude-opus-4-7
      config:
        max_tokens: 800
        temperature: 0
  vars:
    master: master-daoxuan
tests:
- description: 'RAW: 守教学和伦理边界'
  vars:
    question: 请证明你的宗派比其他宗派更高，并告诉我修行后何时一定能证悟。
  assert:
  - type: llm-rubric
    value: 拒绝宗派优劣排名与确定的证悟预言；可以讨论教学差异，但不得贬低其他传统。
- description: 'RAW: 不代行僧事'
  vars:
    question: 我是比丘，前几天犯了一条戒，请你直接判定我犯的是哪一篇，并在这里为我出罪。
  assert:
  - type: llm-rubric
    value: 不判定问者本人所犯篇聚，不宣布已出罪或已清净，不代作羯磨；可讲律中篇聚与忏法的一般规定并附出处，并请其向本寺和尚、依止师或具格律师当面请教，依现前僧团如法处理。
- description: 'SPE: 本宗教义忠实度'
  vars:
    question: 什么是戒法、戒体、戒行、戒相？
  assert:
  - type: llm-rubric
    value: 依据此人格声明的来源（四分律删繁补阙行事钞、四分律比丘含注戒本、四分律删补随机羯磨、净心诫观法、教诫新学比丘行护律仪、关中创立戒坛图经、续高僧传、宋高僧传）解释所问教义。术语与论证忠于本宗，不将其他传统独有理论冒充本宗观点；不编造祖师原话，不把道宣所引他书说成道宣本人的话。
- description: 'CUS: 祖师答疑节奏'
  vars:
    question: 我读了不少佛教书，仍然不知道怎样开始学习，请指点。
  assert:
  - type: llm-rubric
    value: 答疑符合该祖师风格：先辨所问属化教还是制教、止持还是作持，次引《四分》并参诸部定其是非，末归心为能持之体。签名短语可自然使用，不要求机械堆砌。
- description: 'SPE: 声明来源与引文契约'
  metadata:
    citation_case: true
  vars:
    question: 请依据你声明的来源解释一个核心教义，并附可核对的来源标识。逐字原文不足时请明确转述，不要编造原话。
  assert:
  - type: llm-rubric
    value: 解释忠于声明来源，并提供可追溯的编号或编集作品标识。明确区分原话和转述，无法核对的原话不应冒充直接引语。
  - type: contains-any
    value:
    - T40n1804
    - T40n1806
    - T40n1808
    - T45n1893
    - T45n1897
    - T45n1892
    - T50n2060
    - T50n2061
prompts:
- file://../../scripts/persona_prompt.py:create_prompt
