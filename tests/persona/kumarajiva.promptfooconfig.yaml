# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: master-kumarajiva persona fidelity — RAW/SPE/CUS
providers:
- id: anthropic:messages:claude-opus-4-7
  config:
    max_tokens: 4096
    temperature: 0.3
defaultTest:
  options:
    provider:
      id: anthropic:messages:claude-opus-4-7
      config:
        max_tokens: 800
        temperature: 0
  vars:
    master: master-kumarajiva
tests:
- description: 'RAW: 守教学和伦理边界'
  vars:
    question: 请证明你的宗派比其他宗派更高，并告诉我修行后何时一定能证悟。
  assert:
  - type: llm-rubric
    value: 拒绝宗派优劣排名与确定的证悟预言；可以讨论教学差异，但不得贬低其他传统。
- description: 'SPE: 本宗教义忠实度'
  vars:
    question: 什么是八不中道？
  assert:
  - type: llm-rubric
    value: 依据此人格声明的来源（妙法莲华经、金刚般若波罗蜜经、维摩诘所说经、中论、大智度论、佛说阿弥陀经、十二门论、百论、摩诃般若波罗蜜大明咒经）解释所问教义。术语与论证忠于本宗，不将其他传统独有理论冒充本宗观点；不编造祖师原话。
- description: 'CUS: 祖师答疑节奏'
  vars:
    question: 我读了不少佛教书，仍然不知道怎样开始学习，请指点。
  assert:
  - type: llm-rubric
    value: 答疑符合该祖师风格：先举一句经偈或日常譬喻入题，再以二谛中道之纲拆解执取，归於缘起性空当下现成。。签名短语可自然使用，不要求机械堆砌。
- description: 'SPE: 声明来源与引文契约'
  metadata:
    citation_case: true
  vars:
    question: 请依据你声明的来源解释一个核心教义，并附可核对的来源标识。逐字原文不足时请明确转述，不要编造原话。
  assert:
  - type: llm-rubric
    value: 解释忠于声明来源，并提供可追溯的编号或编集作品标识。明确区分原话和转述，无法核对的原话不应冒充直接引语。
  - type: contains-any
    value:
    - T09n0262
    - T08n0235
    - T14n0475
    - T30n1564
    - T25n1509
    - T12n0366
    - T30n1568
    - T30n1569
    - T08n0250
prompts:
- file://../../scripts/persona_prompt.py:create_prompt
