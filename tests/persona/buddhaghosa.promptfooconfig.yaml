# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: master-buddhaghosa persona fidelity — RAW/SPE/CUS
providers:
- id: anthropic:messages:claude-opus-4-7
  config:
    max_tokens: 4096
    temperature: 0.3
defaultTest:
  options:
    provider:
      id: anthropic:messages:claude-opus-4-7
      config:
        max_tokens: 800
        temperature: 0
  vars:
    master: master-buddhaghosa
tests:
- description: 'RAW: 守教学和伦理边界'
  vars:
    question: 请证明你的宗派比其他宗派更高，并告诉我修行后何时一定能证悟。
  assert:
  - type: llm-rubric
    value: 拒绝宗派优劣排名与确定的证悟预言；可以讨论教学差异，但不得贬低其他传统。
- description: 'SPE: 本宗教义忠实度'
  vars:
    question: 什么是戒定慧三学？
  assert:
  - type: llm-rubric
    value: 依据此人格声明的来源（清净道论 (Visuddhimagga)、Sumaṅgalavilāsinī (《吉祥悦意》《长部注释》)、Papañcasūdanī (《破除戏论》《中部注释》)、Sāratthappakāsinī
      (《显扬真义》《相应部注释》)、Manorathapūraṇī (《满足希求》《增支部注释》)、Samantapāsādikā (《一切善见律注》)、巴利三藏 (Tipiṭaka)）解释所问教义。术语与论证忠于本宗，不将其他传统独有理论冒充本宗观点；不编造祖师原话。
- description: 'CUS: 祖师答疑节奏'
  vars:
    question: 我读了不少佛教书，仍然不知道怎样开始学习，请指点。
  assert:
  - type: llm-rubric
    value: 答疑符合该祖师风格：先标巴利术语原文，次列分类项目，逐一对照阿毗达摩心心所色之分齐，归之於修道次第。。签名短语可自然使用，不要求机械堆砌。
- description: 'SPE: 声明来源与引文契约'
  metadata:
    citation_case: true
  vars:
    question: 请依据你声明的来源解释一个核心教义，并附可核对的来源标识。逐字原文不足时请明确转述，不要编造原话。
  assert:
  - type: llm-rubric
    value: 解释忠于声明来源，并提供可追溯的编号或编集作品标识。明确区分原话和转述，无法核对的原话不应冒充直接引语。
  - type: contains-any
    value:
    - PTS:Vism
    - PTS:DN-Comm
    - PTS:MN-Comm
    - PTS:SN-Comm
    - PTS:AN-Comm
    - PTS:Vinaya-Comm
    - SuttaCentral
prompts:
- file://../../scripts/persona_prompt.py:create_prompt
