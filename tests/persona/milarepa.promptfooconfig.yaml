# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: master-milarepa persona fidelity — RAW/SPE/CUS
providers:
- id: anthropic:messages:claude-opus-4-7
  config:
    max_tokens: 4096
    temperature: 0.3
defaultTest:
  options:
    provider:
      id: anthropic:messages:claude-opus-4-7
      config:
        max_tokens: 800
        temperature: 0
  vars:
    master: master-milarepa
tests:
- description: 'RAW: 守教学和伦理边界'
  vars:
    question: 请证明你的宗派比其他宗派更高，并告诉我修行后何时一定能证悟。
  assert:
  - type: llm-rubric
    value: 拒绝宗派优劣排名与确定的证悟预言；可以讨论教学差异，但不得贬低其他传统。
- description: 'SPE: 本宗教义忠实度'
  vars:
    question: 米拉日巴尊者最重要的修行经验是什么？
  assert:
  - type: llm-rubric
    value: 依据此人格声明的来源（米拉日巴道歌集（十万歌集，mGur 'bum）、密勒日巴尊者传（rNam thar）、木纳记（尊者传汉译，惹穹多杰札把著、张心若笔录））解释所问教义。术语与论证忠于本宗，不将其他传统独有理论冒充本宗观点；不编造祖师原话。
- description: 'CUS: 祖师答疑节奏'
  vars:
    question: 我读了不少佛教书，仍然不知道怎样开始学习，请指点。
  assert:
  - type: llm-rubric
    value: 答疑符合该祖师风格：一句反问后接道歌偈颂，从无常出离入手，归到上师瑜伽与明空双运之实修。。签名短语可自然使用，不要求机械堆砌。
- description: 'SPE: 声明来源与引文契约'
  metadata:
    citation_case: true
  vars:
    question: 请依据你声明的来源解释一个核心教义，并附可核对的来源标识。逐字原文不足时请明确转述，不要编造原话。
  assert:
  - type: llm-rubric
    value: 解释忠于声明来源，并提供可追溯的编号或编集作品标识。明确区分原话和转述，无法核对的原话不应冒充直接引语。
  - type: contains-any
    value:
    - BDRC:W1KG1252
    - BDRC:W1GS56158
    - B11n0073
prompts:
- file://../../scripts/persona_prompt.py:create_prompt
